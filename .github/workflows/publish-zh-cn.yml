name: Publish zh-CN Core (amd64)

on:
  push:
    branches: [feat/l10n-zh-cn]
    paths:
      - .github/workflows/publish-zh-cn.yml
      - docker/zh-cn/**
      - ui/**
      - client/core/ts/**

permissions:
  contents: read

concurrency:
  group: publish-zh-cn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sqkkyzx/komodo'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          version=$(node -p 'require("./client/core/ts/package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/komodo-core"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$name:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build amd64 image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/zh-cn/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=komodo-zh-cn-amd64
          cache-to: type=gha,scope=komodo-zh-cn-amd64,mode=max

      - name: Verify binaries and HTTP startup
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
        run: bash docker/zh-cn/verify-image.sh "$IMAGE_REF" "$EXPECTED_VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image and verify registry config
        id: published
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          docker push "$IMAGE_REF"
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Image}}' > "$RUNNER_TEMP/zh-cn-image.json"
          jq -e --arg revision "$GITHUB_SHA" --arg version "$EXPECTED_VERSION" '
            .os == "linux" and .architecture == "amd64" and
            .config.Labels["org.opencontainers.image.revision"] == $revision and
            .config.Labels["org.opencontainers.image.version"] == $version
          ' "$RUNNER_TEMP/zh-cn-image.json"
          digest=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' | jq -er '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Promote verified version and rolling tags
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            {
              echo '### Verified image for an older commit'
              echo
              echo "- Commit: $IMAGE_REF"
              echo "- Digest: $IMAGE_NAME@$IMAGE_DIGEST"
              echo '- Version and rolling tags were preserved because the branch has newer commits.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for tag in "$EXPECTED_VERSION-zh-cn" latest-zh-cn; do
            docker tag "$IMAGE_REF" "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
            digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$tag" --format '{{json .Manifest}}' | jq -er '.digest')
            test "$digest" = "$IMAGE_DIGEST"
          done
          {
            echo '### Verified linux/amd64 image'
            echo
            echo "- Version: $IMAGE_NAME:$EXPECTED_VERSION-zh-cn"
            echo "- Rolling: $IMAGE_NAME:latest-zh-cn"
            echo "- Commit: $IMAGE_REF"
            echo "- Digest: $IMAGE_NAME@$IMAGE_DIGEST"
            echo '- Checks: official Core/CLI binary hashes, /version, homepage, JavaScript, CSS'
          } >> "$GITHUB_STEP_SUMMARY"
